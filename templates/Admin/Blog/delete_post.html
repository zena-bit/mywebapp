{% extends 'admin_base.html' %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card border-0 shadow-sm p-5 bg-white">
        <div class="text-danger mb-3">
            <i class="fa fa-exclamation-triangle fa-4x"></i>
        </div>
        <h2 class="fw-bold text-dark mb-3">Delete Post</h2>
        <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ post.title }}"</strong>? This action cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <button class="btn btn-danger rounded-pill px-4 text-white">Confirm Delete</button>
            <a href="{% url 'post-list' %}" class="btn btn-light border rounded-pill px-4 text-dark ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
