{% extends 'admin_base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">All Posts</h2>
            <a href="{% url 'create-post' %}" class="btn btn-primary rounded-pill px-4 text-white" style="background-color: #f28b00; border-color: #f28b00;">Add New Post</a>
        </div>
        <div class="table-responsive">
            <table class="table align-middle table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for post in posts %}
                    <tr>
                        <td class="fw-semibold text-dark">{{ post.title }}</td>
                        <td class="text-end">
                            <a href="{% url 'post-detail' post.pk %}" class="btn btn-sm btn-outline-info rounded-pill px-3 me-1">View</a>
                            <a href="{% url 'update-post' post.pk %}" class="btn btn-sm btn-outline-warning rounded-pill px-3 me-1">Edit</a>
                            <a href="{% url 'delete-post' post.pk %}" class="btn btn-sm btn-outline-danger rounded-pill px-3">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center py-5 text-muted">
                            <i class="fa fa-folder-open fa-3x mb-3 d-block" style="color: #ccc;"></i>
                            No blog posts available.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
